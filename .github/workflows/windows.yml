name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run test:target-browser
      - run: npm run build:win
      - run: node scripts/verify-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Desktop-Windows
          path: |
            release/*.zip
            release/*Setup*.exe
      - name: Attach release downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $binary = Get-ChildItem release/*-win.zip | Select-Object -First 1
          Copy-Item $binary.FullName release/OrbitDesktop-Windows.zip
          $installer = Get-ChildItem 'release/*Setup*.exe' | Select-Object -First 1
          Copy-Item $installer.FullName release/OrbitDesktop-Setup.exe
          $version = node -p 'require("./package.json").version'
          git archive --format=zip --prefix=OrbitDesktop/ --output=OrbitDesktop-source.zip HEAD
          gh release upload "v$version" release/OrbitDesktop-Windows.zip release/OrbitDesktop-Setup.exe OrbitDesktop-source.zip --clobber
